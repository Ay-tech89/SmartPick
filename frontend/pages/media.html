<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies & TV Shows - SmartPick</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
   
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages.css">
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">
                <a href="../index.html">
                    <i class="bi bi-stars"></i> SmartPick
                </a>
            </h1>
            <div class="nav-links">
                <a href="media.html" class="active">
                    <i class="bi bi-film"></i> Media
                </a>
                <a href="books.html">
                    <i class="bi bi-book"></i> Books
                </a>
                <button id="theme-toggle" class="theme-btn">
                    <i class="bi bi-moon-stars"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="page-main">
        <section class="page-hero">
            <div class="hero-content">
                <div class="hero-icon">
                    <i class="bi bi-film"></i>
                </div>
                <h1 class="page-title">Movies & TV Shows</h1>
                <p class="page-subtitle">Discover your next binge-worthy series or cinematic masterpiece</p>
                
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Search for movies, genres, or actors...">
                    <button id="search-btn">
                        <i class="bi bi-search"></i> Search
                    </button>
                </div>
            </div>
        </section>

        <section class="recommendations">
            <div class="container">
                <div class="section-header">
                    <h2>
                        <i class="bi bi-star-fill"></i> Recommended for You
                    </h2>
                    <button id="refresh-btn" class="refresh-btn">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                </div>
                
                <div id="loading" class="loading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p>Finding perfect matches...</p>
                </div>

                <div id="recommendations-grid" class="recommendations-grid">
                    <!-- Recommendations will be loaded here -->
                </div>
            </div>
        </section>
    </main>
    <script src="../js/pages.js"></script>
</body>
</html>
